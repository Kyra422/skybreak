name: Source regressions
on: [push, pull_request]
permissions:
  contents: read
jobs:
  calibration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile source-only sensor regression
        run: g++ -std=c++20 -O2 -pthread -Ioutputs/nwiirecomp/nWiiRuntime/src -Ioutputs/nwiirecomp/nWiiRuntime/include tests/gyro_calibration_test.cpp -o /tmp/gyro-test
      - name: Run
        run: /tmp/gyro-test
      - name: Compile source-only interpolation regression
        run: g++ -std=c++20 -O2 -pthread -Ioutputs/nwiirecomp/nWiiRuntime/include tests/interpolation_test.cpp -o /tmp/interpolation-test
      - name: Check camera, particle matching and frame pacing
        run: /tmp/interpolation-test
      - name: Compile gyro aim filtering regression
        run: g++ -std=c++20 -O2 -pthread -Ioutputs/nwiirecomp/nWiiRuntime/src -Ioutputs/nwiirecomp/nWiiRuntime/include tests/gyro_aim_filter_test.cpp -o /tmp/gyro-aim-test
      - name: Check idle drift, slow aim and sensor timing
        run: /tmp/gyro-aim-test
      - name: Compile steering calibration regression
        run: g++ -std=c++20 -O2 -pthread -Ioutputs/nwiirecomp/nWiiRuntime/src -Ioutputs/nwiirecomp/nWiiRuntime/include tests/gyro_bias_test.cpp -o /tmp/gyro-bias-test
      - name: Check slow steering, guided calibration and reconnects
        run: /tmp/gyro-bias-test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate fresh installer settings
        run: python tests/test_default_settings.py
